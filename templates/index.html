{% extends "base.html" %}
{% load static %}

{% block title %}여행 에이전트{% endblock %}

    {% block content %}
        <!-- Travel Hero Section -->
        <section id="travel-hero" class="travel-hero section dark-background">

            <div class="hero-background">
                <video autoplay="" muted="" loop="">
                <source src="{% static 'img/travel/video-2.mp4' %}" type="video/mp4">
                </video>
                <div class="hero-overlay"></div>
            </div>

            <div class="container position-relative">
                <div class="row align-items-center">
                    <div class="col-lg">
                        <div class="container position-relative tx-center keep-all title-wrap">
                            <h1>당신만의 여행을 설계해주는 여행 에이전트</h1>
                            <p>AI가 나에게 꼭 맞는 여행 계획을 추천해줘요</p>
                        </div>

                        <form class="search-form tx-center" action="" method="post">
                            {% csrf_token %}
                            <div class="form-wrapper">
                                <input type="text" name="text" class="text-input" placeholder="예: 강남, 마포 2박3일 힐링" required="">
                                <button type="submit" class="subscribe-btn">
                                    <i class="bi bi-arrow-right"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </section><!-- /Travel Hero Section -->

        <section id="card-list" class="card-list section">

            <!-- Section Title -->
            <div class="container section-title aos-init aos-animate" data-aos="fade-up">
                <h2>Travel Plane</h2>
                <div><span>사람들의</span> <span class="description-title">여행 플랜</span></div>
            </div><!-- End Section Title -->

            <div class="container aos-init aos-animate" data-aos="fade-up" data-aos-delay="100"> 

                <div class="row gy-4">
                    
                </div>    

                <div class="text-center mt-5 aos-init aos-animate" data-aos="fade-up" data-aos-delay="500">
                    <a href="tours.html" class="btn-view-all">View All Tours</a>
                </div>

            </div>

        </section>

    {% endblock %}
