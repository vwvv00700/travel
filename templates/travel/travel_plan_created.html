<h2>채팅방: {{ room.travel_plan.title }}</h2>

<div id="chat-log">
    {% for msg in messages %}
        <p><strong>{{ msg.user.username }}:</strong> {{ msg.content }}</p>
    {% endfor %}
</div>

<input id="chat-message-input" type="text">
<button id="chat-message-submit">Send</button>

<script>
const roomId = "{{ room.id }}";
const ws = new WebSocket(`ws://${window.location.host}/ws/chat/${roomId}/`);

ws.onmessage = function(e) {
    const data = JSON.parse(e.data);
    const chatLog = document.getElementById('chat-log');
    chatLog.innerHTML += `<p><strong>${data.username}:</strong> ${data.message}</p>`;
};

document.getElementById('chat-message-submit').onclick = function() {
    const input = document.getElementById('chat-message-input');
    ws.send(JSON.stringify({'message': input.value}));
    input.value = '';
};
</script>
