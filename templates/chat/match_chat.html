{% load static %}

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 여행 매칭 & 채팅</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
/* === 전체 스타일 === */
body {
    font-family: 'Inter', sans-serif;
    margin: 0;
    background: linear-gradient(120deg, #f5f7fa 0%, #c3cfe2 100%);
    display: flex;
    height: 100vh;
    overflow: hidden;
}

/* === 앱 컨테이너 === */
#app-container {
    display: flex;
    width: 100%;
    height: 100%;
    box-shadow: 0 0 30px rgba(0,0,0,0.05);
    border-radius: 12px;
    overflow: hidden;
}

/* === 사이드바 === */
#sidebar {
    width: 320px;
    background-color: #fff;
    padding: 20px;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #e0e7ff;
    overflow-y: auto;
}

#sidebar header {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 20px;
    color: #3b82f6;
    display: flex;
    align-items: center;
}

#sidebar header i {
    margin-right: 10px;
}

.match-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.partner-card {
    display: flex;
    align-items: center;
    background: #f9fafc;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 15px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 3px 6px rgba(0,0,0,0.05);
}

.partner-card:hover {
    transform: translateY(-2px);
    background: #e0f2fe;
}

.partner-card img {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    margin-right: 12px;
    border: 2px solid #3b82f6;
}

.partner-card .partner-name {
    font-weight: 600;
    font-size: 16px;
    color: #111827;
}

.partner-card p {
    margin: 2px 0 0 0;
    font-size: 0.85em;
    color: #6b7280;
}

/* === 채팅 영역 === */
#chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #fefefe;
    position: relative;
    transition: all 0.3s;
}

.hidden {
    display: none;
}

.chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 25px;
    border-bottom: 1px solid #e5e7eb;
    background: #f3f4f6;
    font-weight: 500;
}

#partner-info {
    display: flex;
    align-items: center;
}

#partner-info img {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    margin-right: 12px;
    border: 2px solid #3b82f6;
}

#partner-name {
    font-weight: 600;
    font-size: 18px;
    color: #111827;
}

.chat-actions button {
    background: #3b82f6;
    border: none;
    color: white;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    margin-left: 8px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.2s;
}

.chat-actions button:hover {
    background: #2563eb;
}

/* === 채팅 메시지 === */
#chat-box {
    flex: 1;
    padding: 25px;
    overflow-y: auto;
    background: linear-gradient(180deg, #ffffff 0%, #f3f4f6 100%);
}

.chat-message {
    display: flex;
    margin-bottom: 16px;
}

.chat-message.self {
    justify-content: flex-end;
}

.msg-content {
    max-width: 65%;
    padding: 12px 18px;
    border-radius: 20px;
    background: #e0f2fe;
    color: #111827;
    font-size: 14px;
    word-wrap: break-word;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.chat-message.self .msg-content {
    background: #3b82f6;
    color: #fff;
}

/* === 입력창 === */
.chat-input-form {
    display: flex;
    padding: 16px 25px;
    border-top: 1px solid #e5e7eb;
    background: #f3f4f6;
}

#msg-input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 999px;
    border: 1px solid #d1d5db;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
}

#msg-input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
}

#send-btn {
    background: #3b82f6;
    border: none;
    color: #fff;
    border-radius: 999px;
    padding: 0 20px;
    margin-left: 12px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
}

#send-btn:hover {
    background: #2563eb;
    transform: translateY(-1px);
}
</style>
</head>

<body>
<script>
const MY_USERNAME = "{{ request.user.username|default:'Guest' }}"; 
</script>

<div id="app-container">
    <!-- Sidebar -->
    <aside id="sidebar">
        <header><i class="fas fa-users-line"></i> 파트너 매칭 목록</header>
        <ul id="match-list">
            {% if message %}
            <p style="text-align:center; color: #ef4444; font-weight:bold; margin-bottom:12px;">
                {{ message }}
            </p>
            {% endif %}
            {% for partner in partners %}
            <li class="partner-card" data-room-id="{{ partner.id }}">
                <img src="{% static 'images/default-avatar.png' %}" alt="{{ partner.name }} 아바타">
                <div>
                    <span class="partner-name">{{ partner.name }}</span>
                    <p>{{ partner.trip }}</p>
                </div>
            </li>
            {% empty %}
            <p style="text-align:center; padding:20px; color:#6b7280;">매칭된 파트너가 없습니다.</p>
            {% endfor %}
        </ul>
    </aside>

    <!-- Chat Area -->
    <main id="chat-area" class="hidden">
        <header class="chat-header">
            <div id="partner-info">
                <img id="partner-avatar" src="{% static 'images/default-avatar.png' %}" alt="파트너 아바타">
                <span id="partner-name">여행 파트너 선택</span>
            </div>
            <div class="chat-actions">
                <button class="action-btn" title="여행 계획 보기"><i class="fas fa-map-location-dot"></i></button>
                <button id="back-to-list-btn" class="action-btn" title="목록으로"><i class="fas fa-arrow-left"></i></button>
            </div>
        </header>

        <div id="chat-box"></div>

        <footer class="chat-input-form">
            <input type="text" id="msg-input" placeholder="메시지를 입력하세요..." autocomplete="off">
            <button id="send-btn" title="전송"><i class="fas fa-paper-plane"></i></button>
        </footer>
    </main>
</div>

<script src="{% static 'script/match_chat_script.js' %}"></script>
</body>
</html>
